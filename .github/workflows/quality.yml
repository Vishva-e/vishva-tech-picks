# Checks only: never deploys, publishes, or connects Amazon credentials.
name: Foundation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and generate first lockfile
        run: npm install --no-audit --no-fund
      - name: Preserve generated dependency lockfile for reviewed commit
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-lock
          path: package-lock.json
          retention-days: 7
      - name: Type-check, test and build
        run: npm run validate
      # One-time reviewed Phase 1.1 bootstrap: only the owner's feature branch,
      # and only after the full validation succeeds. Remove after lockfile lands.
      - name: Commit generated lockfile on approved repair branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/phase-1-1-ci-amazon-agent' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: commit reviewed npm dependency lockfile"
            git push origin "HEAD:refs/heads/fix/phase-1-1-ci-amazon-agent"
          fi
