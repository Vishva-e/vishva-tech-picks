# Checks only: never deploys, publishes, or connects Amazon credentials.
name: Foundation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and generate first lockfile
        run: npm install --no-audit --no-fund
      - name: Preserve generated dependency lockfile for reviewed commit
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-lock
          path: package-lock.json
          retention-days: 7
      - name: Type-check, test and build
        run: npm run validate
