# CI only — no deployment and no account permissions or secrets.
name: Foundation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Reproducible dependency install
        run: npm ci --no-audit --no-fund
      - name: Type-check, tests and static build
        run: npm run validate
